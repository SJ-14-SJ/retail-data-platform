services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - retail_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U retail -d retail"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  retail_data:
