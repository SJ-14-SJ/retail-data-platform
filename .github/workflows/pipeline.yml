name: Retail pipeline and data tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retail -d retail"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dbt.txt
      - name: SQLite regression tests
        run: python -m unittest discover -s tests -v
      - name: PostgreSQL regression tests in isolated schemas
        env:
          TEST_DATABASE_URL: postgresql+psycopg://retail:retail@localhost:5432/retail
        run: python -m unittest discover -s tests -v
      - name: Ingest, resume and export
        env:
          DATABASE_URL: postgresql+psycopg://retail:retail@localhost:5432/retail
        run: |
          python -m retail.generate_sample
          python -m retail.cli ingest
          python -m retail.cli ingest
          python -m retail.cli export
      - name: Build and validate analytics models
        run: dbt build --project-dir dbt --profiles-dir dbt
      - name: Benchmark smoke run and row-count verification
        run: python -m retail.benchmark --sizes 1000 2000 --repeats 1 --pipeline-records 200
      - uses: actions/upload-artifact@v4
        with:
          name: analytics-validation
          path: |
            outputs/*.csv
            outputs/benchmark.json
            dbt/target/run_results.json
